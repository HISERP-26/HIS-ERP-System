<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hridhaan ERP • Student Ledger</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#172033}.top{background:#172033;color:white;padding:18px 24px;font-size:20px;font-weight:700}.wrap{max-width:1200px;margin:24px auto;padding:0 16px}.panel{background:white;border:1px solid #ddd;border-radius:10px;padding:18px;margin-bottom:16px}.toolbar{display:flex;gap:10px;flex-wrap:wrap}select,input{padding:10px;border:1px solid #cbd5e1;border-radius:7px}.search{min-width:280px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #e5e7eb;text-align:left}th{background:#f8fafc}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{padding:14px;background:#f8fafc;border-radius:8px}.value{font-size:22px;font-weight:700;margin-top:5px}.muted{color:#667085}.error{color:#b42318;background:#fff1f2;padding:10px;border-radius:7px}@media(max-width:700px){.cards{grid-template-columns:1fr 1fr}.search{min-width:100%}}</style></head><body><div class="top">Hridhaan ERP — Student Ledger</div><div class="wrap"><div class="panel"><div class="toolbar"><select id="student"><option>Loading students…</option></select><select id="session"><option>Loading sessions…</option></select></div><div id="msg" class="muted" style="margin-top:12px">Select a student and academic session.</div></div><div id="profile" class="panel" style="display:none"><h2 id="name"></h2><div id="details" class="muted"></div><h3>Fee Ledger</h3><div class="cards" id="summary"></div><div style="overflow:auto;margin-top:16px"><table><thead><tr><th>Date</th><th>Fee Head</th><th>Period</th><th>Demand</th><th>Concession</th><th>Paid</th><th>Balance</th><th>Due Date</th></tr></thead><tbody id="rows"></tbody></table></div></div></div><script>
const SUPABASE_URL='https://hiserp-26.supabase.co';
const SUPABASE_ANON_KEY='REPLACE_WITH_EXISTING_ANON_KEY';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);let students=[],sessions=[];
async function init(){try{const s=await db.auth.getSession();if(!s.data.session){$('msg').textContent='Please sign in through the main ERP first.';return}const [sr,ar]=await Promise.all([db.from('students').select('id,admission_no,name,father,current_class_id,status').eq('status','Active').order('name'),db.from('academic_sessions').select('id,name,is_current').order('start_date',{ascending:false})]);if(sr.error)throw sr.error;if(ar.error)throw ar.error;students=sr.data||[];sessions=ar.data||[];$('student').innerHTML='<option value="">Select student</option>'+students.map(x=>`<option value="${x.id}">${x.admission_no||''} — ${x.name}</option>`).join('');$('session').innerHTML='<option value="">Select session</option>'+sessions.map(x=>`<option value="${x.id}" ${x.is_current?'selected':''}>${x.name}${x.is_current?' (Current)':''}</option>`).join('');if(sessions.find(x=>x.is_current))$('session').value=sessions.find(x=>x.is_current).id;}catch(e){$('msg').className='error';$('msg').textContent=e.message||String(e)}}
async function load(){const sid=$('student').value,aid=$('session').value;if(!sid||!aid){$('profile').style.display='none';return}try{const st=students.find(x=>x.id===sid);$('name').textContent=st?.name||'Student';$('details').textContent=`Admission No: ${st?.admission_no||'—'} • Status: ${st?.status||'—'}`;const r=await db.from('fee_demands').select('id,fee_type,amount,due_date,period,concession,created_at').eq('student_id',sid).eq('academic_session_id',aid).order('due_date',{ascending:true});if(r.error)throw r.error;const demands=r.data||[];const p=await db.from('fee_payments').select('id,amount,payment_date,notes').eq('student_id',sid).eq('academic_session_id',aid);if(p.error)throw p.error;const paidTotal=(p.data||[]).reduce((a,x)=>a+Number(x.amount||0),0);const demandTotal=demands.reduce((a,x)=>a+Number(x.amount||0),0);const concession=demands.reduce((a,x)=>a+Number(x.concession||0),0);const balance=Math.max(0,demandTotal-concession-paidTotal);$('summary').innerHTML=[['Demand',demandTotal],['Concession',concession],['Paid',paidTotal],['Balance',balance]].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="value">₹${Number(x[1]).toLocaleString('en-IN')}</div></div>`).join('');$('rows').innerHTML=demands.length?demands.map(d=>`<tr><td>${d.created_at?.slice(0,10)||'—'}</td><td>${d.fee_type||'—'}</td><td>${d.period||'—'}</td><td>₹${Number(d.amount||0).toLocaleString('en-IN')}</td><td>₹${Number(d.concession||0).toLocaleString('en-IN')}</td><td>—</td><td>₹${Math.max(0,Number(d.amount||0)-Number(d.concession||0)).toLocaleString('en-IN')}</td><td>${d.due_date||'—'}</td></tr>`).join(''):'<tr><td colspan="8" class="muted">No fee demands for this student/session yet.</td></tr>';$('profile').style.display='block';$('msg').textContent='';}catch(e){$('msg').className='error';$('msg').textContent=e.message||String(e)}}
$('student').onchange=load;$('session').onchange=load;init();
</script></body></html>
