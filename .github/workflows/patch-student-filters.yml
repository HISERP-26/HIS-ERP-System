name: Patch student filters
on:
  push:
    branches: [feature/student-ledger]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'index.html';
            let s = fs.readFileSync(path, 'utf8');
            const oldToolbar = '<button id="addStudentBtn" class="primary">+ Add Student</button><input id="studentSearch" class="search" placeholder="Search admission no., name, father, class…"><select id="studentStatus" style="max-width:180px"><option value="">All status</option><option>Active</option><option>Inactive</option></select>';
            const newToolbar = '<button id="addStudentBtn" class="primary">+ Add Student</button><input id="studentSearch" class="search" placeholder="Search admission no., name, father, class…"><select id="studentClassFilter" style="max-width:180px"><option value="">All Classes</option></select><select id="studentSessionFilter" style="max-width:180px"><option value="">All Academic Years</option></select><select id="studentStatus" style="max-width:180px"><option value="">All status</option><option>Active</option><option>Inactive</option></select>';
            if (!s.includes(oldToolbar)) core.setFailed('Students toolbar pattern not found; no update made.');
            s = s.replace(oldToolbar, newToolbar);
            const oldState = 'let profile=null,currentUser=null,schoolId=null,students=[],classes=[],sessions=[],academicSessions=[];';
            const newState = 'let profile=null,currentUser=null,schoolId=null,students=[],classes=[],sessions=[],academicSessions=[],studentSessionLinks=[];';
            if (!s.includes(oldState)) core.setFailed('State declaration pattern not found.');
            s = s.replace(oldState, newState);
            const oldLoad = "async function loadStudents(){const r=await db.from('students').select('id,school_id,admission_no,name,father,mother,dob,gender,address,fmobile,mmobile,email,category,blood_group,transport,admission_date,current_class,status').order('name',{ascending:true});if(r.error)throw r.error;students=r.data||[];renderStudents()}";
            const newLoad = "async function loadStudents(){const [r,ls]=await Promise.all([db.from('students').select('id,school_id,admission_no,name,father,mother,dob,gender,address,fmobile,mmobile,email,category,blood_group,transport,admission_date,current_class,status').order('name',{ascending:true}),db.from('student_sessions').select('student_id,academic_session_id,class_id,status,classes(name),academic_sessions(name)')]);if(r.error)throw r.error;if(ls.error)throw ls.error;students=r.data||[];studentSessionLinks=ls.data||[];renderStudents()}";
            if (!s.includes(oldLoad)) core.setFailed('loadStudents pattern not found.');
            s = s.replace(oldLoad, newLoad);
            const oldRender = "function renderStudents(){const q=$('studentSearch').value.trim().toLowerCase(),st=$('studentStatus').value,rows=students.filter(s=>(!st||s.status===st)&&(!q||[s.admission_no,s.name,s.father,s.current_class].some(v=>String(v||'').toLowerCase().includes(q))));if(!rows.length){$('studentRows').innerHTML='<tr><td colspan=\"7\" class=\"empty\">No students found.</td></tr>';return}$('studentRows').innerHTML=rows.map(s=>'<tr><td><strong>'+escapeHtml(s.admission_no||'—')+'</strong></td><td>'+escapeHtml(s.name)+'</td><td>'+escapeHtml(s.father||'—')+'</td><td>'+escapeHtml(s.current_class||'—')+'</td><td>'+escapeHtml(s.admission_date||'—')+'</td><td><span class=\"badge\">'+escapeHtml(s.status)+'</span></td><td><button class=\"secondary profileStudent\" data-id=\"'+s.id+'\">Profile</button> <button class=\"secondary editStudent\" data-id=\"'+s.id+'\">Edit</button></td></tr>').join('');document.querySelectorAll('.editStudent').forEach(b=>b.onclick=()=>openStudent(b.dataset.id));document.querySelectorAll('.profileStudent').forEach(b=>b.onclick=()=>openProfile(b.dataset.id))}";
            const newRender = "function renderStudents(){const q=$('studentSearch').value.trim().toLowerCase(),st=$('studentStatus').value,cf=$('studentClassFilter').value,sf=$('studentSessionFilter').value;const rows=students.filter(s=>{const link=sf?studentSessionLinks.find(x=>x.student_id===s.id&&x.academic_session_id===sf):studentSessionLinks.find(x=>x.student_id===s.id&&x.status==='Active');const cls=link?.classes?.name||s.current_class||'';return(!st||s.status===st)&&(!cf||cls===cf)&&(!sf||!!link)&&(!q||[s.admission_no,s.name,s.father,cls].some(v=>String(v||'').toLowerCase().includes(q)))});if(!rows.length){$('studentRows').innerHTML='<tr><td colspan=\"7\" class=\"empty\">No students found for the selected class / academic year.</td></tr>';return}$('studentRows').innerHTML=rows.map(s=>{const link=sf?studentSessionLinks.find(x=>x.student_id===s.id&&x.academic_session_id===sf):studentSessionLinks.find(x=>x.student_id===s.id&&x.status==='Active');const cls=link?.classes?.name||s.current_class||'—';return '<tr><td><strong>'+escapeHtml(s.admission_no||'—')+'</strong></td><td>'+escapeHtml(s.name)+'</td><td>'+escapeHtml(s.father||'—')+'</td><td>'+escapeHtml(cls)+'</td><td>'+escapeHtml(s.admission_date||'—')+'</td><td><span class=\"badge\">'+escapeHtml(s.status)+'</span></td><td><button class=\"secondary profileStudent\" data-id=\"'+s.id+'\">Profile</button> <button class=\"secondary editStudent\" data-id=\"'+s.id+'\">Edit</button></td></tr>'}).join('');document.querySelectorAll('.editStudent').forEach(b=>b.onclick=()=>openStudent(b.dataset.id));document.querySelectorAll('.profileStudent').forEach(b=>b.onclick=()=>openProfile(b.dataset.id))}";
            if (!s.includes(oldRender)) core.setFailed('renderStudents pattern not found.');
            s = s.replace(oldRender, newRender);
            const oldEvents = "$('loginBtn').onclick=signIn;$('addStudentBtn').onclick=()=>openStudent('');$('cancelStudent').onclick=closeStudent;$('studentForm').onsubmit=saveStudent;$('studentSearch').oninput=renderStudents;$('studentStatus').onchange=renderStudents;";
            const newEvents = "$('loginBtn').onclick=signIn;$('addStudentBtn').onclick=()=>openStudent('');$('cancelStudent').onclick=closeStudent;$('studentForm').onsubmit=saveStudent;$('studentSearch').oninput=renderStudents;$('studentClassFilter').onchange=renderStudents;$('studentSessionFilter').onchange=renderStudents;$('studentStatus').onchange=renderStudents;";
            if (!s.includes(oldEvents)) core.setFailed('Student event wiring pattern not found.');
            s = s.replace(oldEvents, newEvents);
            const oldBoot = "monthOptions();await Promise.all([loadDashboard(),loadClasses(),loadStudents(),loadAcademicSessions()]);await loadDashboardReports();";
            const newBoot = "monthOptions();await Promise.all([loadDashboard(),loadClasses(),loadStudents(),loadAcademicSessions()]);setOptions('studentClassFilter',classes,'All Classes',x=>x.name);setOptions('studentSessionFilter',academicSessions,'All Academic Years',x=>x.name+(x.is_current?' (Current)':''));renderStudents();await loadDashboardReports();";
            if (!s.includes(oldBoot)) core.setFailed('Boot pattern not found.');
            s = s.replace(oldBoot, newBoot);
            fs.writeFileSync(path, s);
            const {owner,repo}=context.repo;
            const current=await github.rest.repos.getContent({owner,repo,path,ref:context.ref.replace('refs/heads/','')});
            const content=Buffer.from(s,'utf8').toString('base64');
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,message:'Add class and academic year filters to Students',content,sha:current.data.sha,branch:context.ref.replace('refs/heads/','')});
            core.info('Student filters patched successfully.');