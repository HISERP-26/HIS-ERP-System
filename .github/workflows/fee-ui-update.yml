name: Apply Fee UI Update
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[fee-ui-applied]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch fee UI safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<div id="feeModal" class="modal-back">'
          if 'id="monthlyDemandModal"' not in s:
              modal='''<div id="monthlyDemandModal" class="modal-back"><div class="modal"><h2>Generate Monthly Demand</h2><div id="monthlyDemandError" class="error" style="display:none"></div><form id="monthlyDemandForm"><div class="grid"><div class="field"><label>Academic Session *</label><select id="monthlyDemandSession" required></select></div><div class="field"><label>Month *</label><input id="monthlyDemandMonth" type="month" required></div><div class="field full"><label>Class</label><select id="monthlyDemandClass"><option value="">All Classes</option></select></div></div><div class="notice">Only fee rules marked Monthly will be generated. The due date will be the 10th of the selected month.</div><div class="actions"><button type="button" id="cancelMonthlyDemand" class="secondary">Cancel</button><button class="primary" type="submit">Generate Monthly Demand</button></div></form></div></div>'''
              s=s.replace(marker,modal+marker,1)
          old="""$('addFeeBtn').onclick=()=>openFee('');$('cancelFee').onclick=()=>{$('feeModal').style.display='none'};$('feeForm').onsubmit=saveFee;"""
          new="""$('addFeeBtn').onclick=()=>openFee('');$('cancelFee').onclick=()=>{$('feeModal').style.display='none'};$('feeForm').onsubmit=saveFee;$('generateDemandBtn').onclick=async()=>{if(!adminOnly()){alert('Administrator access required.');return}await openMonthlyDemand()};$('cancelMonthlyDemand').onclick=()=>{$('monthlyDemandModal').style.display='none'};$('monthlyDemandForm').onsubmit=generateMonthlyDemand;"""
          if old in s:
              s=s.replace(old,new,1)
          else:
              raise SystemExit('Expected fee event-handler anchor not found; no UI patch applied')
          insert_after="""async function generateDemandFromRules(sessionId){if(!adminOnly())return;"""
          fn="""async function openMonthlyDemand(){clearError($('monthlyDemandError'));await loadAcademicSessions();setOptions('monthlyDemandSession',academicSessions,'Select session',x=>x.name+(x.is_current?' (Current)':''));setOptions('monthlyDemandClass',classes,'All Classes',x=>x.name);const now=new Date();$('monthlyDemandMonth').value=now.toISOString().slice(0,7);$('monthlyDemandModal').style.display='flex'}
async function generateMonthlyDemand(e){e.preventDefault();clearError($('monthlyDemandError'));if(!adminOnly()){showError($('monthlyDemandError'),'Administrator access required.');return}const sid=$('monthlyDemandSession').value,period=$('monthlyDemandMonth').value,classId=$('monthlyDemandClass').value||null;if(!sid||!period){showError($('monthlyDemandError'),'Academic session and month are required.');return}try{const r=await db.rpc('generate_monthly_fee_demand',{p_academic_session_id:sid,p_period:period,p_class_id:classId,p_due_date:period+'-10'});if(r.error)throw r.error;$('monthlyDemandModal').style.display='none';$('feeMessage').innerHTML='<div class=\"notice\">'+Number(r.data||0)+' monthly demand record(s) generated for '+escapeHtml(period)+'. Due date: '+escapeHtml(period+'-10')+'.</div>';await loadDashboardReports();}catch(err){showError($('monthlyDemandError'),err.message||String(err))}}
"""
          if insert_after not in s:
              raise SystemExit('Monthly demand function anchor not found')
          s=s.replace(insert_after,fn+insert_after,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit UI patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Add monthly demand UI [fee-ui-applied]'
          git push
