name: Apply Monthly Demand UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[monthly-ui-applied]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<div id="feeModal" class="modal-back">'
          if 'id="monthlyDemandModal"' not in s:
              modal = '''<div id="monthlyDemandModal" class="modal-back"><div class="modal"><h2>Generate Monthly Demand</h2><div id="monthlyDemandError" class="error" style="display:none"></div><form id="monthlyDemandForm"><div class="grid"><div class="field"><label>Academic Session *</label><select id="monthlyDemandSession" required></select></div><div class="field"><label>Month *</label><input id="monthlyDemandMonth" type="month" required></div><div class="field full"><label>Class</label><select id="monthlyDemandClass"><option value="">All Classes</option></select></div></div><div class="notice">Preview and confirm the monthly Tuition Fee and Transport Charge demand. Due date is the 10th of the selected month.</div><div id="monthlyDemandPreview" class="table-wrap" style="margin-top:12px;display:none"><table><thead><tr><th>Student</th><th>Class</th><th>Tuition</th><th>Transport</th><th>Total</th></tr></thead><tbody id="monthlyDemandPreviewRows"></tbody></table></div><div class="actions"><button type="button" id="cancelMonthlyDemand" class="secondary">Cancel</button><button type="button" id="previewMonthlyDemand" class="secondary">Preview</button><button class="primary" type="submit">Confirm & Generate</button></div></form></div></div>'''
              s = s.replace(marker, modal + marker, 1)
          anchor = "$('addFeeBtn').onclick=()=>openFee('');$('cancelFee').onclick=()=>{$('feeModal').style.display='none'};$('feeForm').onsubmit=saveFee;"
          replacement = "$('addFeeBtn').onclick=()=>openFee('');$('cancelFee').onclick=()=>{$('feeModal').style.display='none'};$('feeForm').onsubmit=saveFee;$('generateDemandBtn').onclick=async()=>{if(!adminOnly()){alert('Administrator access required.');return}await openMonthlyDemand()};$('cancelMonthlyDemand').onclick=()=>{$('monthlyDemandModal').style.display='none'};$('previewMonthlyDemand').onclick=previewMonthlyDemand;$('monthlyDemandForm').onsubmit=generateMonthlyDemand;"
          if 'openMonthlyDemand()' not in s:
              if anchor not in s:
                  raise SystemExit('fee handler anchor not found')
              s = s.replace(anchor, replacement, 1)
          fn_anchor = "async function generateDemandFromRules(sessionId){"
          functions = '''async function monthlyDemandPreviewRows(sessionId,period,classId){const rules=await db.from('fee_structures').select('class_id,fee_type,amount,frequency,classes(name)').eq('academic_session_id',sessionId).eq('frequency','Monthly');if(rules.error)throw rules.error;const ss=await db.from('student_sessions').select('student_id,class_id,students(name,admission_no),classes(name)').eq('academic_session_id',sessionId).eq('status','Active');if(ss.error)throw ss.error;const existing=await db.from('fee_demands').select('student_id,fee_type,period').eq('academic_session_id',sessionId).eq('period',period);if(existing.error)throw existing.error;const have=new Set((existing.data||[]).map(x=>x.student_id+'|'+x.fee_type));const byStudent=new Map();for(const r of rules.data||[]){for(const st of ss.data||[]){if(classId&&st.class_id!==classId)continue;if(have.has(st.student_id+'|'+r.fee_type))continue;const key=st.student_id;if(!byStudent.has(key))byStudent.set(key,{student:st,tuition:0,transport:0});const v=Number(r.amount||0);if(String(r.fee_type).toLowerCase().includes('tuition'))byStudent.get(key).tuition+=v;if(String(r.fee_type).toLowerCase().includes('transport'))byStudent.get(key).transport+=v;}}return [...byStudent.values()];}
async function openMonthlyDemand(){clearError($('monthlyDemandError'));await loadAcademicSessions();setOptions('monthlyDemandSession',academicSessions,'Select session',x=>x.name+(x.is_current?' (Current)':''));setOptions('monthlyDemandClass',classes,'All Classes',x=>x.name);const now=new Date();$('monthlyDemandMonth').value=now.toISOString().slice(0,7);$('monthlyDemandPreview').style.display='none';$('monthlyDemandModal').style.display='flex'}
async function previewMonthlyDemand(){clearError($('monthlyDemandError'));const sid=$('monthlyDemandSession').value,period=$('monthlyDemandMonth').value,classId=$('monthlyDemandClass').value||null;if(!sid||!period){showError($('monthlyDemandError'),'Academic session and month are required.');return}try{const rows=await monthlyDemandPreviewRows(sid,period,classId);$('monthlyDemandPreviewRows').innerHTML=rows.length?rows.map(x=>'<tr><td>'+escapeHtml((x.student.admission_no?x.student.admission_no+' • ':'')+(x.student.name||''))+'</td><td>'+escapeHtml(x.student.classes?.name||'—')+'</td><td>'+money(x.tuition)+'</td><td>'+money(x.transport)+'</td><td><strong>'+money(x.tuition+x.transport)+'</strong></td></tr>').join(''):'<tr><td colspan="5" class="empty">No new monthly demand to generate for this selection.</td></tr>';$('monthlyDemandPreview').style.display='block'}catch(err){showError($('monthlyDemandError'),err.message||String(err))}}
async function generateMonthlyDemand(e){e.preventDefault();clearError($('monthlyDemandError'));if(!adminOnly()){showError($('monthlyDemandError'),'Administrator access required.');return}const sid=$('monthlyDemandSession').value,period=$('monthlyDemandMonth').value,classId=$('monthlyDemandClass').value||null;if(!sid||!period){showError($('monthlyDemandError'),'Academic session and month are required.');return}try{const r=await db.rpc('generate_monthly_fee_demand',{p_academic_session_id:sid,p_period:period,p_class_id:classId,p_due_date:period+'-10'});if(r.error)throw r.error;$('monthlyDemandModal').style.display='none';$('feeMessage').innerHTML='<div class="notice">'+Number(r.data||0)+' monthly demand record(s) generated for '+escapeHtml(period)+'. Due date: '+escapeHtml(period+'-10')+'.</div>';await loadDashboardReports();}catch(err){showError($('monthlyDemandError'),err.message||String(err))}}
'''
          if 'async function openMonthlyDemand()' not in s:
              if fn_anchor not in s:
                  raise SystemExit('monthly demand function anchor not found')
              s = s.replace(fn_anchor, functions + fn_anchor, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-monthly-demand-ui.yml
          git add index.html
          git commit -m 'Add monthly demand preview and confirmation [monthly-ui-applied]'
          git push
